<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container-grid">
            <img src="img/Logo.svg" alt="Imagem da Logo">
            <h1>CapyTech Burguers</h1>
        </div>
    </header>
    <div class="subtitulos">
        <div class="container-grid">
            <div class="linha">
                <div class="linha-amarela"></div>
            </div>
            <h2>Hambúrgueres</h2>
            <div class="linha">
                <div class="linha-amarela"></div>
            </div>
        </div>
    </div>
    <section id="hamburgueres">
        <div class="container-grid">
            <div class="opcoes-lanches">
                <div class="texto">
                    <div class="titulo-preco">
                        <h3>Duplo Capy Cheddar</h3>
                        <div class="preco">
                            <h3>R$20,00</h3>
                        </div>
                    </div>
                    <p>
                        Dois hambúrgueres suculentos,
                        cheddar derretido, tomate fresco e 
                        picles crocantes no pão com gergelim
                    </p>
                </div>
                <img src="img/Hamburguer 1 1.svg" alt="">
            </div>
        </div>
    </section>
</body>
</html>
